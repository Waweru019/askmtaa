<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    
    <!-- Logo -->
    <!-- Logo -->
    <div class="flex justify-center">
      <img 
        src="/logo.jpeg" 
        alt="AskMtaa Logo" 
        class="h-12 w-12 rounded-xl object-contain shadow-sm"
      />
    </div>

    <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
      Reset your password
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      Remember your password?
      <a routerLink="/login" class="font-medium text-emerald-600 hover:text-emerald-500">
        Sign in
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-slate-100">
      
      <!-- Global Alert Feedback -->
      <div *ngIf="errorMessage()" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 text-red-700 text-sm rounded">
        {{ errorMessage() }}
      </div>

      <div *ngIf="successMessage()" class="mb-4 bg-emerald-50 border-l-4 border-emerald-500 p-4 text-emerald-700 text-sm rounded">
        {{ successMessage() }}
      </div>

      <!-- STEP 1: Request 6-Digit OTP -->
      <form *ngIf="currentStep() === 1" [formGroup]="requestForm" (ngSubmit)="onRequestOTP()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
          <div class="mt-1">
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="vendor@example.com"
              class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 text-sm"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="requestForm.invalid || isLoading()"
          class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50 transition"
        >
          <span *ngIf="!isLoading()">Send 6-Digit Code</span>
          <span *ngIf="isLoading()">Sending code...</span>
        </button>
      </form>

      <!-- STEP 2: Enter OTP & New Password -->
      <form *ngIf="currentStep() === 2" [formGroup]="resetForm" (ngSubmit)="onResetPassword()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-700">Email Address</label>
          <input
            type="email"
            formControlName="email"
            readonly
            class="mt-1 block w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-md text-slate-500 text-sm cursor-not-allowed"
          />
        </div>

        <div>
          <label for="otp" class="block text-sm font-medium text-slate-700">6-Digit Verification Code</label>
          <div class="mt-1">
            <input
              id="otp"
              type="text"
              maxlength="6"
              formControlName="otp"
              placeholder="123456"
              class="tracking-widest font-mono text-center text-lg block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
            />
          </div>
        </div>

        <div>
          <label for="new_password" class="block text-sm font-medium text-slate-700">New Password</label>
          <div class="mt-1">
            <input
              id="new_password"
              type="password"
              formControlName="new_password"
              placeholder="••••••••"
              class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 text-sm"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-500">
          <button type="button" (click)="currentStep.set(1)" class="hover:underline text-emerald-600">
            Resend code or change email
          </button>
        </div>

        <button
          type="submit"
          [disabled]="resetForm.invalid || isLoading()"
          class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50 transition"
        >
          <span *ngIf="!isLoading()">Update Password</span>
          <span *ngIf="isLoading()">Resetting password...</span>
        </button>
      </form>

    </div>
  </div>
</div>
